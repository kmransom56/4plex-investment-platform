<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Restaurant Network NOC</title>
  <style>
    body { margin: 0; display: flex; height: 100vh; overflow: hidden; font-family: sans-serif; }
    #asset-panel { width: 250px; background: #f4f4f4; padding: 10px; overflow-y: auto; }
    #asset-panel h4 { margin: 8px 0 4px 0; color: #555; font-size: 14px; }
    #asset-panel hr { margin: 8px 0; border: none; border-top: 1px solid #ddd; }
    .asset-item { padding: 8px; margin: 4px 0; background: white; border: 1px solid #ddd; cursor: grab; border-radius: 4px; transition: background 0.2s; }
    .asset-item:hover { background: #e8f4f8; }
    .asset-item:active { cursor: grabbing; }
    #main { flex: 1; position: relative; }
    #topo-canvas { width: 100%; height: 100%; display: block; background: #222; }
    #controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
    #yaml-sync, #status-chips { position: absolute; bottom: 10px; left: 10px; background: rgba(255,255,255,0.9); padding: 8px; max-width: 350px; max-height: 200px; overflow: auto; font-size: 12px; }
    #yaml-sync textarea { width: 100%; height: 120px; font-family: monospace; font-size: 12px; border: 1px solid #ddd; padding: 4px; border-radius: 2px; }
    #yaml-sync textarea:not([readonly]) { background: #fffef7; }
    .status-chip { display: inline-block; padding: 4px 8px; margin-right: 4px; border-radius: 4px; background: #ccc; cursor: pointer; }
    .status-chip.active { background: #4caf50; color: white; }
    #thumbnail-preview { position: absolute; bottom: 10px; right: 10px; border: 1px solid #999; background: white; padding: 4px; }
    #thumbnail-preview img { display: block; width: 120px; height: auto; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
  <script src="https://threejs.org/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <div id="asset-panel">
    <h3>Device Library</h3>
    
    <h4>Network Infrastructure</h4>
    <div class="asset-item" draggable="true" data-type="firewall">🔥 Firewall</div>
    <div class="asset-item" draggable="true" data-type="router">🌐 Router</div>
    <div class="asset-item" draggable="true" data-type="switch">🔌 Switch</div>
    <div class="asset-item" draggable="true" data-type="access_point">📶 Wi-Fi AP</div>
    <div class="asset-item" draggable="true" data-type="server">🖥️ Server</div>
    
    <h4>Restaurant Equipment</h4>
    <div class="asset-item" draggable="true" data-type="pos_terminal">💳 POS Terminal</div>
    <div class="asset-item" draggable="true" data-type="fryer">🍟 Fryer</div>
    <div class="asset-item" draggable="true" data-type="camera">📹 Security Cam</div>
    
    <hr>
    <h4>Topology Tools</h4>
    <button id="btn-import-yaml" style="width:100%; margin:2px 0; padding:6px;">📁 Import YAML</button>
    <button id="btn-export-yaml" style="width:100%; margin:2px 0; padding:6px;">💾 Export YAML</button>
    <button id="btn-load-yaml" style="width:100%; margin:2px 0; padding:6px;">🔄 Load from Editor</button>
    <button id="btn-auto-layout" style="width:100%; margin:2px 0; padding:6px;">📐 Auto Layout</button>
    <button id="btn-clear-scene" style="width:100%; margin:2px 0; padding:6px; background:#ff6b6b; color:white;">🗑️ Clear Scene</button>
  </div>

  <div id="main">
    <canvas id="topo-canvas"></canvas>

    <div id="controls">
      <button id="btn-generate-pdf">📄 Generate PDF</button>
      <button id="btn-import-visio">📊 Import Visio</button>
    </div>

    <div id="yaml-sync">
      <strong>YAML Editor</strong>
      <textarea id="yaml-output" placeholder="YAML topology will appear here...\nYou can also paste YAML and click 'Load from Editor'"></textarea>
    </div>

    <div id="status-chips">
      <div class="status-chip active" data-status="pending">Pending</div>
      <div class="status-chip" data-status="approved">Approved</div>
      <div class="status-chip" data-status="completed">Completed</div>
    </div>

    <div id="thumbnail-preview">
      <strong>Thumbnail</strong>
      <img id="thumb-img" src="" alt="thumbnail" />
    </div>
  </div>

</body>
</html>
